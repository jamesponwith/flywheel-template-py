# Build inner-loop gate. Must stay under 10s total or it will get skipped — speed is a feature.
# Hooks no-op until uv is installed: https://docs.astral.sh/uv/
pre-commit:
  parallel: true
  commands:
    format:
      run: command -v uv >/dev/null || exit 0; uv run ruff format --check .
    lint:
      run: command -v uv >/dev/null || exit 0; uv run ruff check .
    test:
      run: command -v uv >/dev/null || exit 0; uv run pytest
    shellsyntax:
      glob: "*.sh"
      # bash -n, not sh -n: these scripts declare bash and use [[ ]].
      run: bash -n {staged_files}

# Validate assistant: local AI review before code leaves the machine — no CI minutes, no secrets.
# ponytail: advisory (never blocks the push); flip to blocking if findings start getting ignored.
pre-push:
  commands:
    ai-review:
      # Three lenses (correctness, security, simplicity), findings recorded in
      # .flywheel/review.jsonl. Advisory: `|| true` never blocks a push.
      run: command -v claude >/dev/null || exit 0; claude -p "/flywheel-review origin/main...HEAD" || true
